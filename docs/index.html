isplay: flex; gap: 18px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--color-divider)\"><span style=\"font-family: var(--font-mono); font-size: 11px; color: var(--color-accent-700)\">04<\/span><span style=\"font-family: var(--font-heading); font-size: clamp(20px, 2.2vw, 28px)\">Le respect du chantier<\/span><\/li><li class=\"reveal\" style=\"display: flex; gap: 18px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--color-divider)\"><span style=\"font-family: var(--font-mono); font-size: 11px; color: var(--color-accent-700)\">05<\/span><span style=\"font-family: var(--font-heading); font-size: clamp(20px, 2.2vw, 28px)\">La satisfaction de nos clients<\/span><\/li><\/ul><\/div><\/section><section><div style=\"max-width: var(--shell); margin: 0 auto; padding: clamp(36px, 5vw, 76px) var(--gutter)\"><h2 style=\"font-family: var(--font-heading); font-size: clamp(26px, 3vw, 40px); margin: 0 0 30px; text-transform: uppercase; letter-spacing: -0.02em\">Pourquoi choisir Renov’Ouest ?<\/h2><div style=\"display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr))\"><article class=\"card blueprint reveal\" style=\"padding: 24px; gap: 10px\"><i class=\"corner tl\"><\/i><i class=\"corner tr\"><\/i><i class=\"corner bl\"><\/i><i class=\"corner br\"><\/i><h3 style=\"font-family: var(--font-heading); font-size: 22px; margin: 0; line-height: 1.12\">Un savoir-faire professionnel<\/h3><p style=\"font-size: 14.5px; line-height: 1.6; margin: 0; color: var(--color-neutral-700)\">Des compétences adaptées aux travaux de rénovation et de finition, en intérieur comme en extérieur.<\/p><\/article><article class=\"card blueprint reveal\" style=\"padding: 24px; gap: 10px\"><i class=\"corner tl\"><\/i><i class=\"corner tr\"><\/i><i class=\"corner bl\"><\/i><i class=\"corner br\"><\/i><h3 style=\"font-family: var(--font-heading); font-size: 22px; margin: 0; line-height: 1.12\">Un travail précis<\/h3><p style=\"font-s 0 0 18px\">INFORMATIONS LÉGALES<\/p><h1 style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(32px, 4.4vw, 56px); margin: 0 0 16px; text-transform: uppercase; letter-spacing: -0.025em\">Politique de confidentialité<\/h1><p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 8px; max-width: 60ch; color: var(--color-neutral-700)\">Cette page décrit les données collectées via ce site, leur finalité et les droits dont vous disposez.<\/p><p style=\"font-family: var(--font-mono); font-size: 11px; color: var(--color-neutral-600); margin: 0 0 30px\">DERNIÈRE MISE À JOUR : 8 septembre 2026<\/p><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Données collectées<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Via le formulaire de demande de devis : nom et prénom, téléphone, email, type de projet, adresse du chantier, message, et le cas échéant budget indicatif et date souhaitée. Aucune autre donnée n’est collectée à votre insu.<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Finalité du traitement<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Ces données servent uniquement à répondre à votre demande, échanger sur votre projet et établir un devis.<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Base légale<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Le traitement repose sur votre consentement, exprimé par l’envoi du formulaire, et sur l’intérêt légitime de l’entreprise à répondre aux demandes qui lui sont adressées.<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Destinataire<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Les demandes sont adressées à Renov&#39;Ouest uniquement (renovouest49@gmail.com). Aucune donnée n’est vendue, louée ni cédée à des tiers.<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Durée de conservation<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Les demandes sont conservées le temps nécessaire au traitement du projet, puis pour la durée légale applicable. Durée précise : à compléter.<\/p><p style=\"margin: 12px 0 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--color-accent-800); border: 1px solid var(--color-accent-600); background: var(--color-accent-100); padding: 10px 12px\">À FOURNIR PAR L’ENTREPRISE AVANT LA MISE EN LIGNE DÉFINITIVE<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Vos droits<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Vous disposez d’un droit d’accès, de rectification, d’effacement, de limitation et d’opposition sur vos données. Pour l’exercer, écrivez à renovouest49@gmail.com ou appelez le 06 63 72 98 00. Vous pouvez également introduire une réclamation auprès de la CNIL.<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Cookies et mesure d’audience<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Ce site n’utilise aucun cookie de suivi ni outil de mesure d’audience. Si un tel outil est ajouté ultérieurement, un mécanisme de consentement sera mis en place au préalable.<\/p><\/div><div style=\"border-top: 1px solid var(--color-divider); padding: 24px 0\"><h2 style=\"font-family: var(--font-heading); font-size: 23px; margin: 0 0 10px\">Hébergement des données<\/h2><p style=\"font-size: 15.5px; line-height: 1.7; margin: 0; white-space: pre-line; color: var(--color-neutral-800)\">Les données transitent par l’hébergeur du site et par la messagerie de l’entreprise. Coordonnées de l’hébergeur : à compléter.<\/p><p style=\"margin: 12px 0 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--color-accent-800); border: 1px solid var(--color-accent-600); background: var(--color-accent-100); padding: 10px 12px\">À FOURNIR PAR L’ENTREPRISE AVANT LA MISE EN LIGNE DÉFINITIVE<\/p><\/div><\/div><\/section><\/main><footer class=\"on-dark\" style=\"background: #17212c; color: #f7f4ef\"><div style=\"max-width: var(--shell); margin: 0 auto; padding: clamp(36px, 5vw, 68px) var(--gutter); display: grid; gap: 32px; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr))\"><div><div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px\"><img src=\"data:image/webp;base64,UklGRpAJAABXRUJQVlA4IIQJAACwJgCdASpcAFwAPm0qkkakIiGhLjcMAIANiUAZl+BaBy2ONVt3PMB53XpR/3e+Qby7/esEA7J/8r4Q+SH2b7h8eCI18o+/H63zQ7y/hv/Zeg7/Lf8f6Er4Tkf8T/u/UC9aPpv/D/sfjR6k2QB+VnGYeVewB+dvQh/5f9T59/pf/x+4N+t3/H9dH2Y/uF7OH7jN3L71f79GT1flo/IIeB9sBBCcaCDfYMPAULw6Sk1zg///7ByQqhy/6ShTEOX0i+xir75mO8UBnfVDhlKVb+evi8B1DFYUjINPY7hJf7nMNymfIIwGr+Ux5s8lchGoSMJzPEFPha3R6m7DG6gsnu9JQ11RJUQ08QmnZCtbV/vMhbxX468t5fRjkIb8UMxA/zPEtVGRByGSazv8zW5XOvOb4MUdv9ozvKOs7tC0jAAA/v395a8yq+QCAsikGxKikq+yK6w31sBL3kO99dOvT8mG4xhRPTXM9yCKmE3mQ67usunCs5Q69LtngvKek9bD4AjvkcFlbRruVawFFQoNl+r   var app = document.getElementById('app');

  function routeFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h || h === '/') return '/';
    h = h.replace(/\/$/, '');
    return DATA[h] ? h : '/404';
  }

  function runScripts(root) {
    // Les <script> insérés via innerHTML ne s'exécutent pas : on les recrée.
    root.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      for (var i = 0; i < old.attributes.length; i++) {
        s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      }
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }

  function render(route, keepScroll) {
    var page = DATA[route] || DATA['/404'];
    app.innerHTML = page.html;
    var dec = document.createElement('textarea');
    dec.innerHTML = page.title;
    document.title = dec.value;
    runScripts(app);
    if (!keepScroll) window.scrollTo(0, 0);
    // Le formulaire n'a pas de serveur ici : on montre l'écran de confirmation
    // sans rien envoyer, et on le dit clairement.
    var form = app.querySelector('#devis');
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        if (!form.reportValidity()) return;
        var ok = app.querySelector('#rw-success');
        if (ok) {
          form.hidden = true;
          ok.hidden = false;
          var note = document.createElement('p');
          note.style.cssText = 'margin:14px 0 0;font-size:13.5px;color:var(--color-neutral-700)';
          note.textContent = 'Aperçu de validation : aucun email n’a été envoyé. ' +
            'Le formulaire sera pleinement fonctionnel une fois le site en ligne.';
          ok.appendChild(note);
          ok.scrollIntoView({ block: 'center' });
        }
      }, true);
    }
  }

  // Les liens internes deviennent des ancres de navigation.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (/^(https?:|mailto:|tel:)/.test(href)) return;
    if (href.charAt(0) !== '/') return;
    e.preventDefault();
    var clean = href.split('#')[0].replace(/\/$/, '') || '/';
    if (('#' + clean) === location.hash) { render(routeFromHash()); return; }
    location.hash = clean;
  });

  window.addEventListener('hashchange', function () { render(routeFromHash()); });
  render(routeFromHash());
})();
